<!doctype html>
<html lang="es" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>Contrareloj Study</title>
    <!-- Favicon Minimalista de Reloj: Data URI inline para forzar renderizado inmediato en Chrome/Localhost sin problemas de cache -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%20fill='none'%3E%3Cdefs%3E%3ClinearGradient%20id='g'%20x1='0%25'%20y1='0%25'%20x2='100%25'%20y2='100%25'%3E%3Cstop%20offset='0%25'%20stop-color='%238b5cf6'/%3E%3Cstop%20offset='100%25'%20stop-color='%234f46e5'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect%20width='64'%20height='64'%20rx='16'%20fill='url(%23g)'/%3E%3Ccircle%20cx='32'%20cy='32'%20r='21'%20stroke='%23ffffff'%20stroke-width='4.5'%20stroke-linecap='round'%20stroke-linejoin='round'/%3E%3Cpolyline%20points='32%2017%2032%2032%2043%2038'%20stroke='%23ffffff'%20stroke-width='4.5'%20stroke-linecap='round'%20stroke-linejoin='round'/%3E%3Ccircle%20cx='32'%20cy='32'%20r='2.5'%20fill='%23ffffff'/%3E%3C/svg%3E" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=5" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=5" />
    <link rel="shortcut icon" href="/favicon.ico?v=5" />
    <link rel="apple-touch-icon" href="/favicon-32x32.png?v=5" />
    <script>
      (function() {
        var svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none"><defs><linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#8b5cf6"/><stop offset="100%" stop-color="#4f46e5"/></linearGradient></defs><rect width="64" height="64" rx="16" fill="url(#g)"/><circle cx="32" cy="32" r="21" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/><polyline points="32 17 32 32 43 38" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="32" cy="32" r="2.5" fill="#ffffff"/></svg>`;
        var uri = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
        function applyFavicon() {
          var links = document.querySelectorAll("link[rel*='icon']");
          links.forEach(function(l) { l.remove(); });
          var link = document.createElement('link');
          link.rel = 'icon';
          link.type = 'image/svg+xml';
          link.href = uri;
          document.head.appendChild(link);
        }
        applyFavicon();
        window.addEventListener('DOMContentLoaded', applyFavicon);
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" media="print" onload="this.media='all'">

    </noscript>
    <!-- Google Identity Services para OAuth 2.0 y sincronizacion con Google Drive (asincrono no bloqueante) -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
      html, body {
        overflow-x: clip;
      }
      body {
        font-family: 'DM Sans', sans-serif;
        background: radial-gradient(ellipse 80% 40% at 50% -10%, rgba(139, 92, 246, 0.12), transparent 70%), #090314;
        color: #f1f5f9;
      }
      /* Sleek Ultra-Thin Premium Scrollbars */
      ::-webkit-scrollbar {
        width: 5px;
        height: 5px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(139, 92, 246, 0.22);
        border-radius: 9999px;
        transition: background-color 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(168, 85, 247, 0.55);
      }
      * {
        scrollbar-width: thin;
        scrollbar-color: rgba(139, 92, 246, 0.25) transparent;
      }
    </style>
  </head>

    <div id="root"></div>
