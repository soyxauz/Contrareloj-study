<!doctype html>
<html lang="es" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>Contrareloj Study | Plataforma de Estudio Adaptativo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" crossorigin="anonymous">
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Identity Services para OAuth 2.0 y sincronizacion con Google Drive -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <!-- PDF.js Local 100% Offline para extraccion precisa de texto de documentos PDF -->
    <script src="/pdf.min.js"></script>
    <script>
      if (window.pdfjsLib) {
        window.pdfjsLib.GlobalWorkerOptions.workerSrc = '/pdf.worker.min.js';
      }
    </script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['"DM Sans"', 'system-ui', 'sans-serif'],
            },
            colors: {
              thea: {
                bg: '#090314',
                surface: '#130924',
                surfaceLight: '#1d0f36',
                border: '#2c194f',
                accent: '#8b5cf6',
                accentHover: '#7c3aed',
                plusGold: '#f59e0b',
                plusRose: '#ec4899',
                cyan: '#06b6d4',
              }
            }
          }
        }
      }
    </script>
    <style>
      html {
        scroll-behavior: smooth;
      }
      body {
        font-family: 'DM Sans', sans-serif;
        background-color: #090314;
        color: #f1f5f9;
        overflow-x: hidden;
      }
      /* Sleek Ultra-Thin Premium Scrollbars */
      ::-webkit-scrollbar {
        width: 5px;
        height: 5px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(139, 92, 246, 0.22);
        border-radius: 9999px;
        transition: background-color 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(168, 85, 247, 0.55);
      }
      * {
        scrollbar-width: thin;
        scrollbar-color: rgba(139, 92, 246, 0.25) transparent;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
