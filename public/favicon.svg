<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="contrarelojGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
  </defs>
  <!-- Contenedor squircle redondeado con degradado Contrareloj (alta legibilidad en cualquier tema) -->
  <rect width="64" height="64" rx="16" fill="url(#contrarelojGrad)" />
  
  <!-- Esfera del reloj minimalista -->
  <circle cx="32" cy="32" r="21" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Manecillas minimalistas de alta precisión -->
  <polyline points="32 17 32 32 43 38" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Eje pivote central -->
  <circle cx="32" cy="32" r="2.5" fill="#ffffff" />
</svg>
